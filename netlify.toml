[build]
  publish = "."

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
